<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>스카이 스트라이커</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;overflow:hidden;font-family:"Segoe UI","Malgun Gothic",sans-serif;color:#fff}
  #wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
  canvas{background:#070a1c;max-height:100vh;max-width:100vw;aspect-ratio:3/4;height:100vh;touch-action:none;box-shadow:0 0 40px #1a2a6c88}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
  #overlay h1{font-size:clamp(32px,6vw,56px);margin:0 0 8px;letter-spacing:2px;background:linear-gradient(#7fe3ff,#3a7bff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
  #overlay p{margin:6px 0;color:#b8c4ff;font-size:16px}
  #overlay .start{margin-top:18px;font-size:20px;color:#ffe066;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.3}}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="600" height="800"></canvas>
  <div id="overlay">
    <h1>스카이 스트라이커</h1>
    <p>이동: 방향키 / WASD / 마우스·터치 드래그</p>
    <p>사격: 자동 &nbsp;|&nbsp; 폭탄: B 또는 X (화면 전체 공격)</p>
    <p>일시정지: P</p>
    <p id="final"></p>
    <p class="start">클릭하거나 Enter를 눌러 시작</p>
  </div>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const overlay = document.getElementById('overlay'), finalEl = document.getElementById('final');

let best = 0;
try { best = +localStorage.getItem('skyStrikerBest') || 0; } catch (e) {}

// ---------- 입력 ----------
const keys = {};
let pointer = null;
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if ((e.code === 'Enter' || e.code === 'Space') && state !== 'play') startGame();
  if (e.code === 'KeyP' && state === 'play') paused = !paused;
  if ((e.code === 'KeyB' || e.code === 'KeyX') && state === 'play' && !paused) useBomb();
});
addEventListener('keyup', e => keys[e.code] = false);
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') { startGame(); return; }
  pointer = toCanvas(e); pointer.ox = player.x; pointer.oy = player.y;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!pointer) return;
  const p = toCanvas(e);
  player.x = clamp(pointer.ox + (p.x - pointer.x), 20, W - 20);
  player.y = clamp(pointer.oy + (p.y - pointer.y), 30, H - 30);
});
cv.addEventListener('pointerup', () => pointer = null);
overlay.addEventListener('click', startGame);
overlay.style.pointerEvents = 'auto';

// ---------- 사운드 (WebAudio 간단 효과음) ----------
let ac = null;
function sfx(type) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.connect(g); g.connect(ac.destination);
    const set = {
      shot:  ['square', 880, 440, .03, .05],
      boom:  ['sawtooth', 160, 40, .12, .3],
      big:   ['sawtooth', 120, 20, .2, .8],
      power: ['triangle', 500, 1200, .12, .25],
      hit:   ['square', 200, 80, .15, .2],
    }[type];
    o.type = set[0];
    o.frequency.setValueAtTime(set[1], t);
    o.frequency.exponentialRampToValueAtTime(set[2], t + set[4]);
    g.gain.setValueAtTime(set[3], t);
    g.gain.exponentialRampToValueAtTime(.001, t + set[4]);
    o.start(t); o.stop(t + set[4]);
  } catch (e) {}
}

// ---------- 유틸 ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;

// ---------- 상태 ----------
let state = 'title', paused = false;
let player, bullets, enemies, eBullets, particles, items, stars, score, wave, waveTimer, spawnTimer, boss, shake, msg, msgTime;

particles = [];
stars = Array.from({ length: 120 }, () => ({ x: rand(0, W), y: rand(0, H), s: rand(.5, 2.5) }));

function startGame() {
  if (state === 'play') return;
  player = { x: W / 2, y: H - 100, hp: 5, maxHp: 5, power: 1, bombs: 3, cool: 0, inv: 120, shield: 0 };
  bullets = []; enemies = []; eBullets = []; particles = []; items = [];
  score = 0; wave = 1; waveTimer = 0; spawnTimer = 60; boss = null; shake = 0;
  showMsg('WAVE 1');
  state = 'play'; paused = false;
  overlay.classList.add('hidden');
}

function gameOver() {
  state = 'over';
  if (score > best) { best = score; try { localStorage.setItem('skyStrikerBest', best); } catch (e) {} }
  finalEl.innerHTML = `<b style="color:#ff6b6b;font-size:28px">격추당했습니다!</b><br>점수 ${score.toLocaleString()} &nbsp;|&nbsp; 최고 ${best.toLocaleString()} &nbsp;|&nbsp; 웨이브 ${wave}`;
  overlay.classList.remove('hidden');
}

function showMsg(t) { msg = t; msgTime = 120; }

// ---------- 적 ----------
const ENEMY = {
  scout:   { hp: 1,  r: 16, speed: 2.6, score: 100, color: '#ff6b6b' },
  zigzag:  { hp: 2,  r: 18, speed: 2,   score: 150, color: '#ffa94d' },
  gunner:  { hp: 4,  r: 22, speed: 1.2, score: 250, color: '#b197fc' },
  tank:    { hp: 12, r: 30, speed: .7,  score: 600, color: '#63e6be' },
};
function spawnEnemy() {
  const pool = ['scout', 'scout', 'zigzag'];
  if (wave >= 2) pool.push('gunner', 'zigzag');
  if (wave >= 3) pool.push('tank', 'gunner');
  const type = pool[Math.floor(Math.random() * pool.length)];
  const d = ENEMY[type], hpMul = 1 + (wave - 1) * .25;
  enemies.push({ type, x: rand(30, W - 30), y: -40, vx: 0, vy: d.speed + wave * .1, hp: Math.ceil(d.hp * hpMul),
                 maxHp: Math.ceil(d.hp * hpMul), r: d.r, t: rand(0, 6), fire: rand(40, 120), flash: 0 });
}
function spawnBoss() {
  const hp = 150 + wave * 60;
  boss = { type: 'boss', x: W / 2, y: -100, vx: 1.5, vy: 0, hp, maxHp: hp, r: 60, t: 0, fire: 60, flash: 0, phase: 0 };
  enemies.push(boss);
  showMsg('⚠ 보스 출현 ⚠');
  sfx('big');
}

// ---------- 공격 ----------
function playerShoot() {
  const p = player, lvl = p.power;
  const shot = (dx, vx, vy = -12, dmg = 1) => bullets.push({ x: p.x + dx, y: p.y - 20, vx, vy, dmg });
  shot(0, 0);
  if (lvl >= 2) { shot(-12, 0); shot(12, 0); }
  if (lvl >= 3) { shot(-16, -1.5); shot(16, 1.5); }
  if (lvl >= 4) { shot(-20, -3, -11); shot(20, 3, -11); }
  if (lvl >= 5) { shot(0, 0, -15, 3); }
  sfx('shot');
}
function enemyShoot(e, angle, speed = 4, color = '#ff8787') {
  eBullets.push({ x: e.x, y: e.y + e.r * .6, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, color });
}
function aimAt(e) { return Math.atan2(player.y - e.y, player.x - e.x); }

function useBomb() {
  if (player.bombs <= 0) return;
  player.bombs--;
  sfx('big'); shake = 25;
  eBullets = [];
  for (const e of enemies) damageEnemy(e, e.type === 'boss' ? 40 : 999);
  for (let i = 0; i < 80; i++) particles.push({ x: W / 2, y: H / 2, vx: rand(-12, 12), vy: rand(-12, 12), life: 50, max: 50, color: '#fff3bf', s: rand(2, 6) });
}

function explode(x, y, color, n = 20, big = false) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(1, big ? 9 : 5);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(20, 45), max: 45, color, s: rand(1.5, big ? 6 : 3.5) });
  }
}

function damageEnemy(e, dmg) {
  if (e.hp <= 0) return;
  e.hp -= dmg; e.flash = 4;
  if (e.hp <= 0) {
    const isBoss = e.type === 'boss';
    score += isBoss ? 5000 * wave : ENEMY[e.type].score;
    explode(e.x, e.y, isBoss ? '#ffd43b' : ENEMY[e.type].color, isBoss ? 120 : 22, isBoss);
    sfx(isBoss ? 'big' : 'boom');
    if (isBoss) {
      shake = 30; boss = null;
      for (let i = 0; i < 3; i++) dropItem(e.x + rand(-40, 40), e.y + rand(-20, 20));
      wave++; waveTimer = 0; showMsg(`WAVE ${wave}`);
      player.hp = Math.min(player.maxHp, player.hp + 2);
    } else if (Math.random() < (e.type === 'tank' ? .6 : .08)) dropItem(e.x, e.y);
  }
}

function dropItem(x, y) {
  const r = Math.random();
  const kind = r < .5 ? 'P' : r < .7 ? 'S' : r < .85 ? 'B' : 'H';
  items.push({ x, y, kind, t: 0 });
}

function hitPlayer() {
  if (player.inv > 0) return;
  if (player.shield > 0) { player.shield = 0; player.inv = 60; sfx('hit'); return; }
  player.hp--; player.inv = 90; shake = 12;
  player.power = Math.max(1, player.power - 1);
  sfx('hit'); explode(player.x, player.y, '#74c0fc', 25);
  if (player.hp <= 0) { explode(player.x, player.y, '#ffffff', 80, true); sfx('big'); gameOver(); }
}

// ---------- 업데이트 ----------
function update() {
  for (const s of stars) { s.y += s.s * (state === 'play' ? 1.5 : .8); if (s.y > H) { s.y = 0; s.x = rand(0, W); } }
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= .96; p.vy *= .96; p.life--; }
  particles = particles.filter(p => p.life > 0);
  if (state !== 'play' || paused) return;

  // 플레이어 이동
  const sp = 6.5;
  let dx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  let dy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  if (dx && dy) { dx *= .707; dy *= .707; }
  player.x = clamp(player.x + dx * sp, 20, W - 20);
  player.y = clamp(player.y + dy * sp, 30, H - 30);
  player.tilt = dx;
  if (player.inv > 0) player.inv--;
  if (player.shield > 0) player.shield--;
  if (--player.cool <= 0) { playerShoot(); player.cool = 7; }

  // 웨이브 진행
  waveTimer++;
  if (!boss) {
    if (waveTimer > 60 * 25) spawnBoss();
    else if (--spawnTimer <= 0) { spawnEnemy(); spawnTimer = Math.max(14, 50 - wave * 5) + rand(0, 20); }
  }

  // 아군 탄
  for (const b of bullets) { b.x += b.vx; b.y += b.vy; }
  bullets = bullets.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20 && !b.dead);

  // 적
  for (const e of enemies) {
    e.t += .05; if (e.flash) e.flash--;
    if (e.type === 'boss') {
      if (e.y < 120) e.y += 1.5;
      else {
        e.x += e.vx; if (e.x < 80 || e.x > W - 80) e.vx *= -1;
        e.phase = e.hp < e.maxHp * .5 ? 1 : 0;
        if (--e.fire <= 0) {
          const pat = Math.floor(e.t / 4) % 3;
          if (pat === 0) { for (let i = 0; i < 12 + e.phase * 6; i++) enemyShoot(e, (i / (12 + e.phase * 6)) * Math.PI * 2 + e.t, 3.2, '#ffd43b'); e.fire = 50 - e.phase * 15; }
          else if (pat === 1) { const a = aimAt(e); for (let i = -2; i <= 2; i++) enemyShoot(e, a + i * .18, 4.5, '#ff6b6b'); e.fire = 30 - e.phase * 8; }
          else { enemyShoot(e, Math.PI / 2 + Math.sin(e.t * 3) * 1.1, 5, '#da77f2'); enemyShoot(e, Math.PI / 2 - Math.sin(e.t * 3) * 1.1, 5, '#da77f2'); e.fire = 5; }
        }
      }
    } else {
      if (e.type === 'zigzag') e.x += Math.sin(e.t * 2) * 3;
      if (e.type === 'scout') e.x += (player.x - e.x) * .006;
      e.x = clamp(e.x, 15, W - 15);
      e.y += e.vy * (e.type === 'gunner' && e.y > 150 && e.y < 250 ? .3 : 1);
      if ((e.type === 'gunner' || e.type === 'tank') && e.y > 0 && --e.fire <= 0) {
        if (e.type === 'gunner') { enemyShoot(e, aimAt(e), 3.5 + wave * .2); e.fire = rand(70, 110) - wave * 4; }
        else { for (let i = -1; i <= 1; i++) enemyShoot(e, Math.PI / 2 + i * .3, 3, '#63e6be'); e.fire = 90; }
      }
      if (e.y > H + 50) e.hp = 0, e.gone = true;
    }
    // 충돌: 탄 → 적
    for (const b of bullets) {
      if (!b.dead && e.hp > 0 && dist2(b, e) < (e.r + 4) ** 2) {
        b.dead = true; damageEnemy(e, b.dmg);
        particles.push({ x: b.x, y: b.y, vx: rand(-2, 2), vy: rand(-2, 1), life: 10, max: 10, color: '#fff', s: 2 });
      }
    }
    // 충돌: 적 → 플레이어
    if (e.hp > 0 && dist2(e, player) < (e.r + 12) ** 2) { hitPlayer(); if (e.type !== 'boss') damageEnemy(e, 999); }
  }
  enemies = enemies.filter(e => e.hp > 0);

  // 적 탄
  for (const b of eBullets) {
    b.x += b.vx; b.y += b.vy;
    if (dist2(b, player) < 8 ** 2) { b.dead = true; hitPlayer(); }
  }
  eBullets = eBullets.filter(b => !b.dead && b.y < H + 10 && b.y > -10 && b.x > -10 && b.x < W + 10);

  // 아이템
  for (const it of items) {
    it.t++; it.y += 1.5; it.x += Math.sin(it.t * .05) * .8;
    if (dist2(it, player) < 30 ** 2) {
      it.dead = true; sfx('power'); score += 50;
      if (it.kind === 'P') { if (player.power < 5) player.power++; else score += 1000; showMsg(player.power >= 5 ? 'POWER MAX!' : 'POWER UP'); }
      if (it.kind === 'S') { player.shield = 600; showMsg('SHIELD'); }
      if (it.kind === 'B') { player.bombs = Math.min(5, player.bombs + 1); showMsg('BOMB +1'); }
      if (it.kind === 'H') { player.hp = Math.min(player.maxHp, player.hp + 1); showMsg('HP +1'); }
    }
  }
  items = items.filter(it => !it.dead && it.y < H + 20);

  if (shake > 0) shake *= .9, shake < .5 && (shake = 0);
  if (msgTime > 0) msgTime--;
}

// ---------- 그리기 ----------
function drawPlayer() {
  const p = player;
  if (p.inv > 0 && Math.floor(p.inv / 5) % 2) return;
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.scale(1 - Math.abs(p.tilt || 0) * .15, 1);
  // 엔진 불꽃
  const f = rand(10, 20);
  ctx.fillStyle = '#ffa94d';
  ctx.beginPath(); ctx.moveTo(-6, 18); ctx.lineTo(0, 18 + f); ctx.lineTo(6, 18); ctx.fill();
  ctx.fillStyle = '#fff3bf';
  ctx.beginPath(); ctx.moveTo(-3, 18); ctx.lineTo(0, 18 + f * .6); ctx.lineTo(3, 18); ctx.fill();
  // 날개
  ctx.fillStyle = '#3a7bff';
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(26, 12); ctx.lineTo(24, 18); ctx.lineTo(0, 10); ctx.lineTo(-24, 18); ctx.lineTo(-26, 12); ctx.closePath(); ctx.fill();
  // 꼬리날개
  ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(11, 22); ctx.lineTo(-11, 22); ctx.closePath(); ctx.fill();
  // 동체
  const g = ctx.createLinearGradient(-8, 0, 8, 0);
  g.addColorStop(0, '#a5d8ff'); g.addColorStop(.5, '#e7f5ff'); g.addColorStop(1, '#74c0fc');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0, -28); ctx.quadraticCurveTo(9, -10, 7, 20); ctx.lineTo(-7, 20); ctx.quadraticCurveTo(-9, -10, 0, -28); ctx.fill();
  // 조종석
  ctx.fillStyle = '#1c7ed6';
  ctx.beginPath(); ctx.ellipse(0, -10, 3.5, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  if (p.shield > 0) {
    ctx.strokeStyle = `rgba(116,192,252,${p.shield < 120 && Math.floor(p.shield / 6) % 2 ? .2 : .7})`;
    ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, 34, 0, Math.PI * 2); ctx.stroke();
  }
}

function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  const white = e.flash > 0;
  if (e.type === 'boss') {
    const c = white ? '#fff' : (e.phase ? '#e03131' : '#c92a2a');
    ctx.fillStyle = white ? '#fff' : '#495057';
    ctx.beginPath(); ctx.moveTo(-90, -10); ctx.lineTo(90, -10); ctx.lineTo(70, 25); ctx.lineTo(-70, 25); ctx.closePath(); ctx.fill();
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.moveTo(0, 60); ctx.lineTo(45, 10); ctx.lineTo(35, -45); ctx.lineTo(-35, -45); ctx.lineTo(-45, 10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = white ? '#fff' : '#343a40';
    for (const sx of [-70, -40, 40, 70]) ctx.fillRect(sx - 5, 20, 10, 20);
    ctx.fillStyle = white ? '#fff' : `hsl(${50 + Math.sin(e.t * 5) * 10},100%,60%)`;
    ctx.beginPath(); ctx.arc(0, 5, 14, 0, Math.PI * 2); ctx.fill();
  } else {
    const col = white ? '#fff' : ENEMY[e.type].color, r = e.r;
    ctx.fillStyle = col;
    if (e.type === 'scout') {
      ctx.beginPath(); ctx.moveTo(0, r); ctx.lineTo(r, -r * .6); ctx.lineTo(0, -r * .2); ctx.lineTo(-r, -r * .6); ctx.closePath(); ctx.fill();
    } else if (e.type === 'zigzag') {
      ctx.rotate(e.t * 3);
      ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .5 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill();
    } else if (e.type === 'gunner') {
      ctx.beginPath(); ctx.moveTo(0, r); ctx.lineTo(r, 0); ctx.lineTo(r * .7, -r); ctx.lineTo(-r * .7, -r); ctx.lineTo(-r, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = white ? '#fff' : '#5f3dc4'; ctx.fillRect(-3, 0, 6, r + 6);
    } else {
      ctx.fillRect(-r, -r * .7, r * 2, r * 1.4);
      ctx.fillStyle = white ? '#fff' : '#0ca678';
      ctx.beginPath(); ctx.arc(0, 0, r * .55, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(-r * .9 - 4, r * .4, 8, 14); ctx.fillRect(r * .9 - 4, r * .4, 8, 14);
    }
    ctx.fillStyle = white ? '#fff' : '#fff9';
    ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, Math.PI * 2); ctx.fill();
    if (e.maxHp > 3 && e.hp < e.maxHp) {
      ctx.fillStyle = '#0008'; ctx.fillRect(-r, -r - 10, r * 2, 4);
      ctx.fillStyle = '#69db7c'; ctx.fillRect(-r, -r - 10, r * 2 * e.hp / e.maxHp, 4);
    }
  }
  ctx.restore();
}

const ITEM_COLOR = { P: '#ff922b', S: '#4dabf7', B: '#f06595', H: '#51cf66' };
function drawItem(it) {
  ctx.save(); ctx.translate(it.x, it.y);
  ctx.shadowColor = ITEM_COLOR[it.kind]; ctx.shadowBlur = 15;
  ctx.fillStyle = ITEM_COLOR[it.kind];
  ctx.beginPath(); ctx.arc(0, 0, 13 + Math.sin(it.t * .15) * 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(it.kind, 0, 1);
  ctx.restore();
}

function drawHUD() {
  ctx.textBaseline = 'top'; ctx.textAlign = 'left'; ctx.font = 'bold 20px "Segoe UI",sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText(`점수 ${score.toLocaleString()}`, 14, 12);
  ctx.font = '14px "Segoe UI",sans-serif'; ctx.fillStyle = '#adb5bd';
  ctx.fillText(`최고 ${Math.max(best, score).toLocaleString()}   WAVE ${wave}`, 14, 38);
  // 체력
  for (let i = 0; i < player.maxHp; i++) {
    ctx.fillStyle = i < player.hp ? '#ff6b6b' : '#495057';
    ctx.fillRect(W - 24 - i * 22, 14, 16, 16);
  }
  ctx.textAlign = 'right'; ctx.fillStyle = '#f06595'; ctx.font = 'bold 15px "Segoe UI",sans-serif';
  ctx.fillText('💣'.repeat(player.bombs) || '폭탄 없음', W - 12, 38);
  ctx.fillStyle = '#ff922b'; ctx.fillText(`POWER ${player.power >= 5 ? 'MAX' : player.power}`, W - 12, 60);
  // 보스 체력
  if (boss) {
    ctx.fillStyle = '#0009'; ctx.fillRect(60, H - 26, W - 120, 12);
    ctx.fillStyle = boss.phase ? '#ff6b6b' : '#ffd43b'; ctx.fillRect(60, H - 26, (W - 120) * boss.hp / boss.maxHp, 12);
    ctx.strokeStyle = '#fff6'; ctx.strokeRect(60, H - 26, W - 120, 12);
  }
  if (msgTime > 0) {
    ctx.globalAlpha = Math.min(1, msgTime / 30); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 40px "Segoe UI","Malgun Gothic",sans-serif'; ctx.fillStyle = '#ffe066';
    ctx.fillText(msg, W / 2, H / 2 - 80); ctx.globalAlpha = 1;
  }
  if (paused) {
    ctx.fillStyle = '#0008'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 44px sans-serif';
    ctx.fillText('일시정지', W / 2, H / 2);
  }
}

function draw() {
  ctx.save();
  if (shake) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  ctx.fillStyle = '#070a1c'; ctx.fillRect(-30, -30, W + 60, H + 60);
  for (const s of stars) { ctx.fillStyle = `rgba(200,215,255,${s.s / 3})`; ctx.fillRect(s.x, s.y, s.s, s.s * 2); }

  if (state !== 'title') {
    for (const it of items) drawItem(it);
    for (const e of enemies) drawEnemy(e);
    ctx.fillStyle = '#ffe066';
    for (const b of bullets) { ctx.fillRect(b.x - (b.dmg > 1 ? 3 : 2), b.y - 8, b.dmg > 1 ? 6 : 4, 14); }
    for (const b of eBullets) {
      ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, 2, 0, Math.PI * 2); ctx.fill();
    }
    if (state === 'play') drawPlayer();
  }
  for (const p of particles) { ctx.globalAlpha = p.life / p.max; ctx.fillStyle = p.color; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (state !== 'title' && player) drawHUD();
}

// ---------- 루프 (60fps 고정 스텝) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
